name: Bug report
description: Report a bug or unexpected behaviour
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Please fill out
        the sections below — the more detail, the faster we can help.

        **Is this a security vulnerability?** Do not open a public issue —
        follow the process in [SECURITY.md](SECURITY.md) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: "When I close the settings sidebar, the page stops scrolling..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to trigger the bug.
      placeholder: |
        1. Log in as Admin
        2. Go to Settings
        3. Click a tab, then close the sidebar
        4. Scroll is locked on body
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: A clear description of the expected result.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: |
        Drag and drop images or paste links. If relevant, include a
        browser DevTools screenshot showing the console or network tab.
  - type: input
    id: version
    attributes:
      label: Version or commit hash
      description: Which version of Mitch‑Risk are you running?
      placeholder: "commit a1b2c3d or v1.2.0"
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Browser
      description: Which browser(s) show the problem?
      multiple: true
      options:
        - Chrome / Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      description: How is the app running?
      options:
        - Docker Compose
        - Bare Node.js
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: |
        Paste any relevant logs. This will be formatted as code.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre‑submission checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have checked this is not a security vulnerability (if so, see SECURITY.md)
          required: true
        - label: I am on the latest commit on `master`
          required: true
