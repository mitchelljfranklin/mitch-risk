services:
  app:
    image: ghcr.io/mitchelljfranklin/mitch-risk:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET}
      EVIDENCE_STORAGE_PATH: ${EVIDENCE_STORAGE_PATH:-/app/.storage/evidence}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - evidence_data:/app/.storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-1.0}"
          memory: "${APP_MEMORY_LIMIT:-1g}"

volumes:
  evidence_data:
