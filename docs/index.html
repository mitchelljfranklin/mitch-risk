<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lightweight third party vendor risk management — build questionnaires, assess vendors, track compliance">
  <title>mitch-risk</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --theme-color: #2563eb;
      --theme-color-light: #eff6ff;
      --theme-color-dark: #1d4ed8;
    }

    .cover img { width: 72px; height: 72px; }
    .cover { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0a0f1d 100%); }
    .cover .cover-main > p:last-child a:first-child {
      background: #2563eb; color: #fff; border-radius: 6px; padding: 8px 24px;
      font-weight: 500; font-size: 1rem;
    }
    .cover .cover-main > p:last-child a:first-child:hover { background: #1d4ed8; }
    .cover .cover-main > p:last-child a:last-child { border-radius: 6px; padding: 8px 24px; font-weight: 500; font-size: 1rem; }
    .cover h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    .cover blockquote { font-size: 1.05rem; color: #e2e8f0; margin-top: 0.5rem; }
    .cover ul { color: #94a3b8; font-size: 0.95rem; max-width: 480px; margin: 1.5rem auto; text-align: left; }
    .cover ul li { margin-bottom: 0.25rem; }
    .cover .cover-main > p:last-child { margin-top: 2rem; }
    .markdown-section { max-width: 820px; }

    @media (max-width: 768px) {
      .cover h1 { font-size: 1.8rem; }
      .markdown-section { padding: 0 1rem; }
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: "mitch-risk",
      repo: "https://github.com/mitchelljfranklin/mitch-risk",
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      search: "auto",
      themeColor: "#2563eb",
      auto2top: true,
      coverpage: true,
      onlyCover: true,
      copyCode: { buttonText: "Copy", errorText: "Error", successText: "Copied" },
      nameLink: {
        "/": "#/?id=mitch-risk",
      },
      swagger: {
        base: "/api-reference/openapi",
        spec: "./openapi.json",
        urls: [{
          name: "mitch-risk API v1",
          url: "./openapi.json",
        }],
      },
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-swagger-ui@latest/dist/docsify-swagger-ui.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-nginx.min.js"></script>
</body>
</html>
