services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitch
      POSTGRES_PASSWORD: mitch
      POSTGRES_DB: mitch_risk
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitch -d mitch_risk"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://mitch:mitch@db:5432/mitch_risk?schema=public"
      # Dev-only defaults — replace AUTH_SECRET, APP_ENCRYPTION_KEY and APP_URL
      # for any real deployment (see README "Running behind a reverse proxy").
      AUTH_SECRET: "dev-only-auth-secret-change-me-0123456789abcdef"
      APP_ENCRYPTION_KEY: "dev-only-encryption-key-change-me-0123456789"
      APP_URL: "http://localhost:3000"
      EVIDENCE_STORAGE_PATH: "/app/.storage/evidence"
      # Number of trusted reverse proxies in front of the app (default 1).
      TRUSTED_PROXY_COUNT: "1"
    # Behind a reverse proxy, do not publish this port publicly — expose it only
    # to the proxy (e.g. an internal Docker network). A directly reachable app
    # port lets clients spoof X-Forwarded-For.
    ports:
      - "3000:3000"
    volumes:
      - evidence_data:/app/.storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(function(r){return r.ok?process.exit(0):process.exit(1)}).catch(function(){process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  evidence_data:
