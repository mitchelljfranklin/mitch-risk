services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitch
      POSTGRES_PASSWORD: mitch
      POSTGRES_DB: mitch_risk
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitch -d mitch_risk"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-0.5}"
          memory: "${DB_MEMORY_LIMIT:-512m}"

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://mitch:mitch@db:5432/mitch_risk?schema=public"
      # Replace these defaults for any real deployment.
      AUTH_SECRET: "dev-only-auth-secret-change-me-0123456789abcdef"
      # WARNING: Changing APP_ENCRYPTION_KEY after initial setup permanently
      # destroys all encrypted secrets (SMTP password, SSO client secrets,
      # cloud storage credentials). Recovery requires restoring the old key
      # or manually re-entering every encrypted secret in Settings.
      APP_ENCRYPTION_KEY: "dev-only-encryption-key-change-me-0123456789"
      APP_URL: "http://localhost:3000"
      # REQUIRED in production — the app refuses to start without it.
      CRON_SECRET: "change-me-cron-secret-0123456789abcdef"
      EVIDENCE_STORAGE_PATH: "/app/.storage/evidence"
      # Number of trusted reverse proxies in front of the app (default 1).
      TRUSTED_PROXY_COUNT: "1"
    # For local development the app port is exposed to the host. For
    # production behind a reverse proxy (Caddy/nginx), either remove this
    # port mapping or switch to an internal-only network so the app port
    # is reachable only by the proxy. A directly reachable app port lets
    # clients spoof X-Forwarded-For.
    ports:
      - "3000:3000"
    volumes:
      - evidence_data:/app/.storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(function(r){return r.ok?process.exit(0):process.exit(1)}).catch(function(){process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-1.0}"
          memory: "${APP_MEMORY_LIMIT:-1g}"

volumes:
  db_data:
  evidence_data:
